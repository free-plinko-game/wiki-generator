{% extends "base.html" %}
{% block title %}Scheduled Posts — Wiki Generator{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h1 class="card-title">Scheduled Posts</h1>
        <p class="card-description">Upcoming wiki posts queued for automatic upload.</p>
    </div>

    <div id="schedule-list">
        <div style="text-align:center;padding:40px;color:var(--color-text-secondary);">Loading...</div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadSchedule() {
    const list = document.getElementById('schedule-list');
    try {
        const res = await fetch('/api/schedule');
        const jobs = await res.json();

        if (jobs.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--color-text-secondary);">No posts scheduled.</div>';
            return;
        }

        list.innerHTML = `
            <table style="width:100%;border-collapse:collapse;font-size:14px;">
                <thead>
                    <tr style="border-bottom:2px solid var(--color-border);text-align:left;">
                        <th style="padding:10px 12px;">Page</th>
                        <th style="padding:10px 12px;">Project</th>
                        <th style="padding:10px 12px;">Scheduled for</th>
                        <th style="padding:10px 12px;"></th>
                    </tr>
                </thead>
                <tbody>
                    ${jobs.map(job => {
                        const dt = job.run_at ? new Date(job.run_at) : null;
                        const formatted = dt ? dt.toLocaleString(undefined, {
                            weekday:'short', month:'short', day:'numeric',
                            hour:'2-digit', minute:'2-digit'
                        }) : '—';
                        const title = job.filename.replace(/\.(wiki|html)$/, '').replace(/_/g, ' ');
                        return `
                        <tr style="border-bottom:1px solid var(--color-border);">
                            <td style="padding:10px 12px;font-weight:500;">${title}</td>
                            <td style="padding:10px 12px;color:var(--color-text-secondary);">${job.name.split(' / ')[0]}</td>
                            <td style="padding:10px 12px;color:var(--color-text-secondary);">${formatted}</td>
                            <td style="padding:10px 12px;text-align:right;">
                                <button class="btn btn-secondary" style="font-size:12px;padding:4px 10px;"
                                        onclick="cancelJob('${job.id}', this)">Cancel</button>
                            </td>
                        </tr>`;
                    }).join('')}
                </tbody>
            </table>`;
    } catch(e) {
        list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--color-error);">Failed to load schedule.</div>';
    }
}

async function cancelJob(jobId, btn) {
    btn.disabled = true;
    btn.textContent = '...';
    try {
        const res = await fetch(`/api/schedule/${encodeURIComponent(jobId)}`, {method:'DELETE'});
        const data = await res.json();
        if (data.success) {
            btn.closest('tr').remove();
            showToast('Post cancelled', 'success');
            if (!document.querySelector('#schedule-list tbody tr')) loadSchedule();
        } else {
            showToast(data.error || 'Failed to cancel', 'error');
            btn.disabled = false;
            btn.textContent = 'Cancel';
        }
    } catch(e) {
        showToast('Error: ' + e.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Cancel';
    }
}

loadSchedule();
</script>
{% endblock %}
