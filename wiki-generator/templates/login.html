<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Wiki Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 380px;
        }
        .login-card h1 {
            font-size: 1.4rem;
            margin-bottom: 1.75rem;
            text-align: center;
        }
        .login-card .form-group {
            margin-bottom: 1rem;
        }
        .login-card .btn {
            width: 100%;
            margin-top: 0.5rem;
        }
        .login-error {
            background: #fee2e2;
            color: #991b1b;
            border-radius: 6px;
            padding: 0.6rem 0.9rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <h1>Wiki Generator</h1>
            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}
            <form method="post">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input class="form-input" type="text" name="username" autofocus autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input class="form-input" type="password" name="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary" type="submit">Sign in</button>
            </form>
        </div>
    </div>
</body>
</html>
